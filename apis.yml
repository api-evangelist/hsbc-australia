    type: OpenAPI
  description: Consumer-authorized Consumer Data Right transactions surface of the
    DSB CDR Banking API (v1.36.0). Covers Get Transactions For Account
    (/banking/accounts/{accountId}/transactions) and Get Transaction Detail
    (/banking/accounts/{accountId}/transactions/{transactionId}). Served from HSBC's
    MTLS host https://mtls.ob.hsbc.com.au/cds-au/v1 and accessible only to Accredited
    Data Recipients acting on a consumer's authorization under the CDR ADR model. Not
    publicly callable; the standardized request/response shape is documented in the
    shared DSB Consumer Data Standards spec bundled in this repo.
