- aid: hsbc-australia:hsbc-developer-portal-commercial-apis
  name: HSBC Developer Portal - Commercial APIs (HSBC Group, partner-gated)
  tags:
  - Commercial Banking
  - Corporate Banking
  - Developer Portal
  - Partner Gated
  - HSBC Group
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://develop.hsbc.com/apis
  baseURL: https://develop.hsbc.com/apis
  properties:
  - url: https://develop.hsbc.com/
    type: DeveloperPortal
  - url: https://develop.hsbc.com/apis
    type: APIReference
  - url: https://develop.hsbc.com/knowledge-article/get-started-open-banking-apis
    type: GettingStarted
  description: HSBC Group's global developer portal (develop.hsbc.com) documents
    commercial / corporate-banking APIs available to HSBC's business and corporate
    clients, alongside Open Banking APIs for non-Australian markets (UK, Hong Kong,
    Europe, Mexico). This is a group-level, registration-gated portal - not an
    Australia-specific developer program - and the commercial API catalogue is
    partner-gated with no public downloadable OpenAPI/Swagger; sandbox and technical
    documentation require account registration. Listed here for completeness because
    HSBC Bank Australia's business/corporate customers are served by HSBC Group
    connectivity; HSBC Australia's own regulated, publicly documented API surface is
    the Consumer Data Right family above, not this portal. No public spec harvested
    (partner-gated).
