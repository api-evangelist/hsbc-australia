name: HSBC Bank Australia
kind: company
description: HSBC Bank Australia Limited is the Australian banking subsidiary of the
  global HSBC Group (HSBC Holdings plc), operating as an Authorised Deposit-taking
  Institution (ADI) regulated by APRA and ASIC. It is a wholly owned, shareholder-owned
  bank (not a customer-owned mutual) offering home loans, everyday and savings accounts,
  credit cards, term deposits, and business and international banking across Australia.
  As a designated data holder under Australia's Consumer Data Right (CDR / Open Banking),
  HSBC Australia exposes a public, unauthenticated Product Reference Data (PRD) API
  plus the full authenticated CDR Banking surface - accounts, balances, transactions,
  direct debits, scheduled payments, and payees - conforming to the DSB Consumer Data
  Standards CDR Banking API (v1.36.0). The public product endpoints are on
  https://public.ob.hsbc.com.au/cds-au/v1 and the consumer-authorized endpoints on
  the MTLS host https://mtls.ob.hsbc.com.au/cds-au/v1, accessible only to Accredited
  Data Recipients under the CDR ADR model. HSBC is presently a data holder only and
  is not accredited to receive third-party banking data. Beyond the Australian CDR
  surface, HSBC Group operates a global developer portal at develop.hsbc.com covering
  commercial/corporate banking APIs and non-Australian Open Banking markets.
