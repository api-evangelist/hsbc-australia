  description: Public, unauthenticated Consumer Data Right Product Reference Data (PRD)
    API. Confirmed live (HTTP 200, x-v 5) at https://public.ob.hsbc.com.au/cds-au/v1/banking/products
    returning a data.products array of HSBC Australia banking products - home loans,
    deposit accounts, credit cards, and term deposits - with rates, fees, features,
    and eligibility. Conforms to the DSB Consumer Data Standards (CDR Banking API);
    Get Products and Get Product Detail ({productId}) endpoints require no authentication.
