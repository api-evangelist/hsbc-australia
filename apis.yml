name: HSBC Bank Australia
kind: company
description: HSBC Bank Australia Limited is the Australian banking subsidiary of the
  global HSBC Group (HSBC Holdings plc), operating as an Authorised Deposit-taking
  Institution (ADI) regulated by APRA and ASIC. It is a wholly owned, shareholder-owned
  bank (not a customer-owned mutual) offering home loans, everyday and savings accounts,
  credit cards, term deposits, and business and international banking across Australia.
  As a designated data holder under Australia's Consumer Data Right (CDR / Open Banking),
  HSBC Australia exposes a public, unauthenticated Product Reference Data (PRD) API
  conforming to the DSB Consumer Data Standards, alongside the authenticated consumer
  data sharing surface reserved for Accredited Data Recipients. HSBC is presently a
  data holder only and is not accredited to receive third-party banking data.
