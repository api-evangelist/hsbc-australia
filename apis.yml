apis:
- aid: hsbc-australia:hsbc-australia-cdr-product-reference-data-api
  name: HSBC Bank Australia CDR Product Reference Data API
  tags:
  - CDR
  - Open Banking
  - Product Reference Data
  - Banking
  - Public
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.hsbc.com.au/help/open-banking/
  baseURL: https://public.ob.hsbc.com.au/cds-au/v1/banking/products
  properties:
  - url: https://www.hsbc.com.au/help/open-banking/
    type: Documentation
  - url: https://public.ob.hsbc.com.au/cds-au/v1/banking/products
    type: APIReference
  - url: openapi/hsbc-australia-cds-banking-products-openapi.yml
    type: OpenAPI
  - url: overlays/hsbc-australia-cds-banking-products-overlay.yaml
    type: Overlay
  description: Public, unauthenticated Consumer Data Right Product Reference Data (PRD)
    API. Confirmed live (HTTP 200, x-v 5) at https://public.ob.hsbc.com.au/cds-au/v1/banking/products
    returning a data.products array of HSBC Australia banking products - home loans,
    deposit accounts, credit cards, and term deposits - with rates, fees, features,
    and eligibility. Conforms to the DSB Consumer Data Standards CDR Banking API; the
    Get Products and Get Product Detail ({productId}) endpoints require no authentication.
- aid: hsbc-australia:hsbc-australia-cdr-accounts-balances-api
  name: HSBC Bank Australia CDR Accounts & Balances API
  tags:
  - CDR
  - Open Banking
  - Accounts
  - Balances
  - Banking
  - Consumer Authorized
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.hsbc.com.au/help/open-banking/
  baseURL: https://mtls.ob.hsbc.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.hsbc.com.au/help/open-banking/
    type: Documentation
  - url: openapi/hsbc-australia-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right accounts surface of the DSB
    CDR Banking API (v1.36.0). Covers Get Accounts (/banking/accounts), Get Bulk
    Balances (/banking/accounts/balances), Get Account Balance
    (/banking/accounts/{accountId}/balance), and Get Account Detail
    (/banking/accounts/{accountId}). These endpoints are served from HSBC's MTLS host
    https://mtls.ob.hsbc.com.au/cds-au/v1 and are accessible only to Accredited Data
    Recipients acting on a consumer's authorization under the CDR ADR model (OAuth2 /
    OIDC, private_key_jwt, PAR, MTLS-bound tokens per HSBC's OpenID configuration).
    Not publicly callable; the standardized shape is documented in the shared DSB spec.
